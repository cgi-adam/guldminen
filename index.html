<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="stylesheet" href="/src/styles.css" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, user-scalable=no"
        />
        <title>Tauri App</title>
        <script type="module" src="/src/main.ts" defer></script>
    </head>

    <body>
        <div class="titlebar">
            <div class="titlebar-controls">
                <button class="titlebar-btn" id="titlebar-minimize">
                    <svg viewBox="0 0 10 1" width="10" height="1">
                        <rect width="10" height="1" fill="currentColor"></rect>
                    </svg>
                </button>
                <button class="titlebar-btn" id="titlebar-close">
                    <svg viewBox="0 0 10 10" width="10" height="10">
                        <path
                            d="M0 0L10 10M10 0L0 10"
                            stroke="currentColor"
                            stroke-width="1.5"
                        ></path>
                    </svg>
                </button>
            </div>
        </div>

        <nav class="top-nav">
            <button id="lang-toggle" class="nav-btn">
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="20"
                    height="20"
                    viewBox="0 0 640 640"
                    fill="currentColor"
                >
                    <path
                        d="M192 64C209.7 64 224 78.3 224 96L224 128L352 128C369.7 128 384 142.3 384 160C384 177.7 369.7 192 352 192L342.4 192L334 215.1C317.6 260.3 292.9 301.6 261.8 337.1C276 345.9 290.8 353.7 306.2 360.6L356.6 383L418.8 243C423.9 231.4 435.4 224 448 224C460.6 224 472.1 231.4 477.2 243L605.2 531C612.4 547.2 605.1 566.1 589 573.2C572.9 580.3 553.9 573.1 546.8 557L526.8 512L369.3 512L349.3 557C342.1 573.2 323.2 580.4 307.1 573.2C291 566 283.7 547.1 290.9 531L330.7 441.5L280.3 419.1C257.3 408.9 235.3 396.7 214.5 382.7C193.2 399.9 169.9 414.9 145 427.4L110.3 444.6C94.5 452.5 75.3 446.1 67.4 430.3C59.5 414.5 65.9 395.3 81.7 387.4L116.2 370.1C132.5 361.9 148 352.4 162.6 341.8C148.8 329.1 135.8 315.4 123.7 300.9L113.6 288.7C102.3 275.1 104.1 254.9 117.7 243.6C131.3 232.3 151.5 234.1 162.8 247.7L173 259.9C184.5 273.8 197.1 286.7 210.4 298.6C237.9 268.2 259.6 232.5 273.9 193.2L274.4 192L64.1 192C46.3 192 32 177.7 32 160C32 142.3 46.3 128 64 128L160 128L160 96C160 78.3 174.3 64 192 64zM448 334.8L397.7 448L498.3 448L448 334.8z"
                    />
                </svg>
                <span id="lang-text" data-i18n="lang.current">Dansk</span>
            </button>

            <button id="theme-toggle" class="nav-btn">
                <svg
                    id="moon-icon"
                    xmlns="http://www.w3.org/2000/svg"
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="currentColor"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
                </svg>
                <svg
                    id="sun-icon"
                    style="display: none"
                    xmlns="http://www.w3.org/2000/svg"
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="currentColor"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <circle cx="12" cy="12" r="4" />
                    <path d="M12 2v2" />
                    <path d="M12 20v2" />
                    <path d="m4.93 4.93 1.41 1.41" />
                    <path d="m17.66 17.66 1.41 1.41" />
                    <path d="M2 12h2" />
                    <path d="M20 12h2" />
                    <path d="m6.34 17.66-1.41 1.41" />
                    <path d="m19.07 4.93-1.41 1.41" />
                </svg>
            </button>
        </nav>

        <main class="container">
            <h1 id="main-header">Bro.</h1>

            <div class="app-core">
                <div id="drop-zone" class="drop-zone">
                    <p class="drop-text-default" data-i18n="dropzone.default">
                        Træk og slip en mappe med<br />
                        billeder og en Excel-fil her
                    </p>
                    <p class="drop-text-hover" data-i18n="dropzone.hover">
                        Slip her
                    </p>
                </div>

                <div id="file-list" class="file-list">
                    <div id="card-img" class="file-card empty">
                        <div class="file-info">
                            <span class="status-badge" data-i18n="badge.images"
                                >Billeder</span
                            >
                            <span id="path-img" class="file-path"
                                >Venter på mappe...</span
                            >
                        </div>
                        <div id="actions-img" class="file-actions hidden">
                            <button
                                id="btn-inspect-img"
                                class="icon-btn"
                                title="Vis mappe"
                            >
                                <svg
                                    xmlns="http://www.w3.org/2000/svg"
                                    viewBox="0 0 640 640"
                                >
                                    <path
                                        d="M320 96C239.2 96 174.5 132.8 127.4 176.6C80.6 220.1 49.3 272 34.4 307.7C31.1 315.6 31.1 324.4 34.4 332.3C49.3 368 80.6 420 127.4 463.4C174.5 507.1 239.2 544 320 544C400.8 544 465.5 507.2 512.6 463.4C559.4 419.9 590.7 368 605.6 332.3C608.9 324.4 608.9 315.6 605.6 307.7C590.7 272 559.4 220 512.6 176.6C465.5 132.9 400.8 96 320 96zM176 320C176 240.5 240.5 176 320 176C399.5 176 464 240.5 464 320C464 399.5 399.5 464 320 464C240.5 464 176 399.5 176 320zM320 256C320 291.3 291.3 320 256 320C244.5 320 233.7 317 224.3 311.6C223.3 322.5 224.2 333.7 227.2 344.8C240.9 396 293.6 426.4 344.8 412.7C396 399 426.4 346.3 412.7 295.1C400.5 249.4 357.2 220.3 311.6 224.3C316.9 233.6 320 244.4 320 256z"
                                    />
                                </svg>
                            </button>
                            <button
                                id="btn-delete-img"
                                class="icon-btn delete-btn"
                                title="Fjern"
                            >
                                <svg
                                    xmlns="http://www.w3.org/2000/svg"
                                    viewBox="0 0 640 640"
                                >
                                    <path
                                        d="M232.7 69.9L224 96L128 96C110.3 96 96 110.3 96 128C96 145.7 110.3 160 128 160L512 160C529.7 160 544 145.7 544 128C544 110.3 529.7 96 512 96L416 96L407.3 69.9C402.9 56.8 390.7 48 376.9 48L263.1 48C249.3 48 237.1 56.8 232.7 69.9zM512 208L128 208L149.1 531.1C150.7 556.4 171.7 576 197 576L443 576C468.3 576 489.3 556.4 490.9 531.1L512 208z"
                                    />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div id="card-excel" class="file-card empty">
                        <div class="file-info">
                            <span class="status-badge" data-i18n="badge.excel"
                                >Excel-fil</span
                            >
                            <span id="path-excel" class="file-path"
                                >Venter på fil...</span
                            >
                        </div>
                        <div id="actions-excel" class="file-actions hidden">
                            <button
                                id="btn-inspect-excel"
                                class="icon-btn"
                                title="Åbn fil"
                            >
                                <svg
                                    xmlns="http://www.w3.org/2000/svg"
                                    viewBox="0 0 640 640"
                                >
                                    <path
                                        d="M320 96C239.2 96 174.5 132.8 127.4 176.6C80.6 220.1 49.3 272 34.4 307.7C31.1 315.6 31.1 324.4 34.4 332.3C49.3 368 80.6 420 127.4 463.4C174.5 507.1 239.2 544 320 544C400.8 544 465.5 507.2 512.6 463.4C559.4 419.9 590.7 368 605.6 332.3C608.9 324.4 608.9 315.6 605.6 307.7C590.7 272 559.4 220 512.6 176.6C465.5 132.9 400.8 96 320 96zM176 320C176 240.5 240.5 176 320 176C399.5 176 464 240.5 464 320C464 399.5 399.5 464 320 464C240.5 464 176 399.5 176 320zM320 256C320 291.3 291.3 320 256 320C244.5 320 233.7 317 224.3 311.6C223.3 322.5 224.2 333.7 227.2 344.8C240.9 396 293.6 426.4 344.8 412.7C396 399 426.4 346.3 412.7 295.1C400.5 249.4 357.2 220.3 311.6 224.3C316.9 233.6 320 244.4 320 256z"
                                    />
                                </svg>
                            </button>
                            <button
                                id="btn-delete-excel"
                                class="icon-btn delete-btn"
                                title="Fjern"
                            >
                                <svg
                                    xmlns="http://www.w3.org/2000/svg"
                                    viewBox="0 0 640 640"
                                >
                                    <path
                                        d="M232.7 69.9L224 96L128 96C110.3 96 96 110.3 96 128C96 145.7 110.3 160 128 160L512 160C529.7 160 544 145.7 544 128C544 110.3 529.7 96 512 96L416 96L407.3 69.9C402.9 56.8 390.7 48 376.9 48L263.1 48C249.3 48 237.1 56.8 232.7 69.9zM512 208L128 208L149.1 531.1C150.7 556.4 171.7 576 197 576L443 576C468.3 576 489.3 556.4 490.9 531.1L512 208z"
                                    />
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>

                <div id="generate-zone">
                    <button
                        id="generate-btn"
                        class="upload-button generate-btn"
                        data-i18n="btn.generate"
                        disabled
                    >
                        Opret et nyt regneark
                    </button>
                </div>
            </div>
        </main>

        <div id="inspect-modal" class="modal-overlay hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="modal-title" data-i18n="modal.title">Filindhold</h2>
                    <button id="btn-close-modal" class="icon-btn delete-btn">
                        ✖
                    </button>
                </div>
                <ul id="modal-file-list" class="modal-list"></ul>
            </div>
        </div>
    </body>
</html>
