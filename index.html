<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="stylesheet" href="/src/styles.css" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Tauri App</title>
        <script type="module" src="/src/main.ts" defer></script>
    </head>

    <body>
        <nav class="top-nav">

                </svg>
                <span id="lang-text">Dansk</span>
            </button>

            <button id="theme-toggle" class="nav-btn">
                <svg
                    id="moon-icon"
                    xmlns="http://www.w3.org/2000/svg"
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="currentColor"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
                </svg>
                <svg
                    id="sun-icon"
                    style="display: none"
                    xmlns="http://www.w3.org/2000/svg"
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="currentColor"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <circle cx="12" cy="12" r="4" />
                    <path d="M12 2v2" />
                    <path d="M12 20v2" />
                    <path d="m4.93 4.93 1.41 1.41" />
                    <path d="m17.66 17.66 1.41 1.41" />
                    <path d="M2 12h2" />
                    <path d="M20 12h2" />
                    <path d="m6.34 17.66-1.41 1.41" />
                    <path d="m19.07 4.93-1.41 1.41" />
                </svg>
            </button>
        </nav>

        <main class="container">
            <h1 id="main-header">God eftermiddag,</h1>

            <div class="status-row">
                <div class="status-item">
                    <div class="status-badge">Billeder</div>
                    <div id="status-img-text" class="status-text not-ready">
                        Ikke klar
                    </div>
                </div>
                <div class="status-item">
                    <div class="status-badge">Excel-fil</div>
                    <div id="status-excel-text" class="status-text not-ready">
                        Ikke klar
                    </div>
                </div>
            </div>

            <div id="drop-zone" class="drop-zone">
                <p class="drop-text-default">
                    Træk og slip en mappe med<br />
                    billeder og en Excel-fil her
                </p>
                <p class="drop-text-hover">Slip her</p>
            </div>

            <div id="generate-zone">
                <button
                    id="generate-btn"
                    class="upload-button generate-btn"
                    disabled
                >
                    Opret et nyt regneark
                </button>
                <p id="missing-text" class="missing-text">
                    * Billeder og Excel-fil mangler at blive lagt ind
                </p>
            </div>

            <!--
            <div class="row">

                <a href="https://tauri.app" target="_blank">
                    <img
                        src="/src/assets/tauri.svg"
                        class="logo tauri"
                        alt="Tauri logo"
                    />
                </a>

            </div>
            -->
        </main>
    </body>
</html>
